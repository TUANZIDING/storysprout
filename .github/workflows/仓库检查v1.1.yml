name: StorySprout repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-10
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified 2026-10-10
        with:
          python-version: '3.12'
      - name: Install pinned check dependencies
        run: python -m pip install -r 检查依赖v1.0.txt
      - name: Validate repository and submitted files
        run: python scripts/仓库检查v1.1.py --check-index
